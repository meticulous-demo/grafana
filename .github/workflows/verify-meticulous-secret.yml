name: Verify Meticulous secret

# Temporary diagnostic for the HTTP 403 on container upload. A GitHub runner has
# none of the local super-admin credentials, so `auth whoami` here reports what
# the METICULOUS_API_TOKEN secret alone resolves to.
on:
  pull_request:
    paths:
      - .github/workflows/verify-meticulous-secret.yml
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    name: Verify Meticulous secret
    runs-on: ubuntu-latest
    steps:
      # GitHub masks the literal secret in logs but not a hash derived from it,
      # so compare against `printf %s '<token>' | shasum -a 256` run locally.
      - name: Fingerprint the secret
        env:
          TOKEN: ${{ secrets.METICULOUS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "METICULOUS_API_TOKEN is not set or is empty"
            exit 1
          fi
          printf 'length=%s\n' "${#TOKEN}"
          printf %s "$TOKEN" | sha256sum

      - name: Report token identity and project
        env:
          METICULOUS_API_TOKEN: ${{ secrets.METICULOUS_API_TOKEN }}
        run: npx -y @alwaysmeticulous/cli auth whoami --json
